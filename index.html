<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>calculadora</title>
</head>
<body>
   <main class="calculadora">

     <input id="tela" type="text" value="0" disabled>

     <button onclick="adicionar('0')">0</button>
     <button onclick="adicionar('1')">1</button>
    <button onclick="adicionar('2')">2</button>
     <button onclick="adicionar('3')">3</button>
     <button onclick="adicionar('4')">4</button>
     <button onclick="adicionar('5')">5</button>
     <button onclick="adicionar('6')">6</button>
     <button onclick="adicionar('7')">7</button>
     <button onclick="adicionar('8')">8</button>
     <button onclick="adicionar('9')">9</button>
     <button onclick="adicionar('-')">-</button>
     <button onclick="adicionar('+')">+</button>
     <button onclick="adicionar('/')">÷</button>
     <button onclick="adicionar('*')">x</button>
     <button onclick="calcular('')">=</button>
      <button onclick="limpar('')">limpar</button>

   </main>



    
    <script>
        const tela= document.getElementById("tela");

function adicionar (valor){
    if (tela.value === "0"){
        tela.value = valor;
    } else{
        ( tela.value = tela.value + valor);
        
    }
}
function calcular(){
    tela.value =eval(tela.value);
}
function limpar() {
 tela.value = "0";
}
    

    </script>
<style>
   * {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  background-color: #222;
  font-family: Arial, sans-serif;
}

.calculadora {
  width: 320px;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;

  background-color: blueviolet;
  border-radius: 15px;
  box-shadow: 0 5px 15px black;
}

#tela {
  grid-column: span 4;
  width: 100%;
  height: 65px;
  padding: 10px;

  border: none;
  border-radius: 8px;
  background-color: white;
  color: #222;

  font-size: 30px;
  text-align: right;
  opacity: 1;
}

button {
  height: 55px;

  border: none;
  border-radius: 8px;
  background-color: white;
  color: #222;

  font-size: 20px;
  cursor: pointer;
}

button:hover {
  background-color: #dddddd;
}

button:active {
  background-color: #aaaaaa;
}
</style>
</body>
</html>
